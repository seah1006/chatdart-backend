services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://chatdart:chatdart1234@db:5432/chatdart
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      start_period: 120s  # DART 기업 리스트 로딩 대기 (최대 2분)
      retries: 3

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: chatdart
      POSTGRES_USER: chatdart
      POSTGRES_PASSWORD: chatdart1234
    volumes:
      - db_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chatdart -d chatdart"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  db_data:
