[pytest]
addopts = -m "not slow"
testpaths = tests
python_files = test_*.py
python_functions = test_*
markers =
    slow: 기본 실행에서 제외되는 장시간 테스트 (CI에서는 전량 실행)
# 비동기/리소스 관련 RuntimeWarning을 에러로 승격 — AGENTS.md 표준 검증을 기본 실행에 강제.
# CI(python -m pytest)도 이 설정을 상속하므로 별도 단계가 필요 없다.
filterwarnings =
    error::RuntimeWarning
# 테스트별 타임아웃 (pytest-timeout). 외부 자원(DB 등) 대기로 인한 무한 hang을
# 실패로 전환. 정상 테스트 최대 소요(~20초)에 여유를 둔 값.
timeout = 60
